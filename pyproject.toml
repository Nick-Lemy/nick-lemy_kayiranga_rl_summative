[project]
name = "nick-lemy-kayiranga-rl-summative"
version = "1.0.0"
description = "Mission-based RL: an autonomous ROV inspecting a subsea pipeline, solved with DQN, REINFORCE, PPO and A2C."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Nick Lemy Kayiranga", email = "n.kayiranga@alustudent.com" }]

dependencies = [
    "gymnasium>=1.0.0",
    "mujoco>=3.2.0",
    "stable-baselines3>=2.4.0",
    "torch>=2.4.0",
    "numpy>=1.26,<2.3",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "tensorboard>=2.16",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "rich>=13.7",
    "tqdm>=4.66",
]

[project.scripts]
subsea-rl = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["environment", "training"]

# --- CPU-only torch on Linux ------------------------------------------------
# The policies here are small MLPs, so CPU training is fast and a GPU buys us
# nothing. Pointing torch at the CPU wheel index keeps `uv sync` to a few
# hundred MB instead of dragging in the full CUDA stack, which matters because
# the marker has to be able to clone and run this project directly.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = ["pytest>=8.0"]
